version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ubeflix-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ubeflix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ubeflix-backend
    restart: unless-stopped
    ports:
      - "5566:5566"
    environment:
      NODE_ENV: ${NODE_ENV}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT}
      VIDEOS_PATH: /videos
      OPENSUBTITLES_API_KEY: ${OPENSUBTITLES_API_KEY:-l9hgHOSfuyQr64vw73UKk1EgADh3D0hi}
      OPENSUBTITLES_USER: ${OPENSUBTITLES_USER:-drakocox}
      OPENSUBTITLES_PASS: ${OPENSUBTITLES_PASS:-15829807vane}
    volumes:
      - ./videos:/videos:ro
      # Unidades del PC montadas en /host (auto-montadas por WSL2 vía fstab)
      - /mnt/host:/host:ro
      # Persistent storage for generated thumbnails and subtitles
      - ubeflix_thumbs:/tmp/ubeflix-thumbs
      - ubeflix_subs:/tmp/ubeflix-subs
      - ubeflix_logs:/tmp/ubeflix-logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ubeflix-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
    container_name: ubeflix-frontend
    restart: unless-stopped
    ports:
      - "3344:80"
    depends_on:
      - backend
    networks:
      - ubeflix-network

volumes:
  postgres_data:
  ubeflix_thumbs:
  ubeflix_subs:
  ubeflix_logs:

networks:
  ubeflix-network:
    driver: bridge
