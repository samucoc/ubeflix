version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ubeflix-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ubeflix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ubeflix-backend
    restart: unless-stopped
    ports:
      - "5566:5566"
    environment:
      NODE_ENV: ${NODE_ENV}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT}
      VIDEOS_PATH: /videos
    volumes:
      - ./videos:/videos:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ubeflix-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
    container_name: ubeflix-frontend
    restart: unless-stopped
    ports:
      - "3344:80"
    depends_on:
      - backend
    networks:
      - ubeflix-network

volumes:
  postgres_data:

networks:
  ubeflix-network:
    driver: bridge
